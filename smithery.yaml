startCommand:
  type: stdio
  configSchema:
    type: object
    required: [perplexityApiKey]
    properties:
      perplexityApiKey:
        type: string
        description: Perplexity API key
  commandFunction: |-
    config => ({ command: 'uv', args: ['run', '--frozen', '--no-dev', 'perplexity-mcp-ultra'], env: { PERPLEXITY_API_KEY: config.perplexityApiKey } })
